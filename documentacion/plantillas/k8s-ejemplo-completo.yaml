apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
spec:
  # Reto 4: Escalamiento de 2 a 6 replicas para soportar mayor trafico (el triple)
  replicas: 6
  # Reto 4: Estrategia de Rolling Update para actualizar sin interrupcion perceptible
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      # Reto 2: Las etiquetas (app: web) coinciden exactamente con el template y el Service
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: app-ejemplo-evaluacion:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    # Reto 2: Se asegura que el selector coincida con los pods (app: web) para que el trafico llegue correctamente
    app: web  
  ports:
  - port: 80
    targetPort: 8080
